<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CARD */
.card {
  background: rgba(17,24,39,0.9);
  backdrop-filter: blur(12px);
  padding:32px;
  border-radius:20px;
  width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  border:1px solid rgba(99,102,241,0.2);
}

/* TITLE */
.title {
  text-align:center;
  margin-bottom:20px;
  font-size:24px;
  font-weight:600;
}

/* INPUT */
.input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  background:#020617;
  border:1px solid #334155;
  color:white;
}

.input:focus {
  border-color:#6366f1;
  box-shadow:0 0 0 2px rgba(99,102,241,0.2);
}

/* BUTTON */
.btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#6366f1,#818cf8);
  font-weight:600;
  cursor:pointer;
}

.btn:hover {
  transform:translateY(-1px);
}

/* LINKS */
.link {
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#9ca3af;
}

.link a {
  color:#818cf8;
  text-decoration:none;
}

/* ERROR MSG */
.msg {
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.3);
  color:#f87171;
  font-size:13px;
  text-align:center;
  padding:8px;
  border-radius:8px;
  margin-bottom:12px;
}

/* LOADER */
.loader-overlay {
  position:fixed;
  inset:0;
  background:#020617;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
}

.loader {
  width:50px;
  height:50px;
  border:5px solid #1e293b;
  border-top:5px solid #6366f1;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

/* FORGOT BOX */
#forgotCard {
  display:none;
  margin-top:15px;
  border-top:1px solid #1e293b;
  padding-top:15px;
}

/* SMALL STATUS */
.small-msg {
  font-size:12px;
  color:#9ca3af;
  margin-bottom:8px;
  text-align:center;
}
</style>
</head>

<body>

<div class="card">
  <div class="title">Welcome Back</div>

  <!-- FLASH -->
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="msg">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <!-- LOGIN FORM -->
  <form method="POST" action="/login" onsubmit="showLoader()">
    <input class="input" type="email" name="email" placeholder="Email" required>
    <input class="input" type="password" name="password" placeholder="Password" required>

    <button class="btn">Continue</button>
  </form>

  <div class="link">
    New here? <a href="/signup">Create account</a>
  </div>

  <div class="link">
    <a href="/forgot">Forgot Password?</a>
  </div>

  <!-- 🔥 FORGOT PASSWORD (UNCHANGED LOGIC, JUST UI) -->
  <div id="forgotCard">

    <div class="small-msg" id="fpMsg"></div>

    <input class="input" id="fpEmail" placeholder="Enter email" />
    <button class="btn" onclick="sendOTP()">Send OTP</button>

    <div id="otpSection" style="display:none;">
      <input class="input" id="fpOtp" placeholder="Enter OTP" />
      <button class="btn" onclick="verifyOTP()">Verify OTP</button>
    </div>

    <div id="resetSection" style="display:none;">
      <input class="input" id="fpPass" type="password" placeholder="New Password" />
      <input class="input" id="fpPass2" type="password" placeholder="Confirm Password" />
      <button class="btn" onclick="resetPassword()">Reset Password</button>
    </div>

  </div>
</div>

<!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader"></div>
  <p style="margin-top:15px;color:#9ca3af;">Verifying your details...</p>
</div>

<script>
function showLoader() {
  document.getElementById("loader").style.display = "flex";
  return true;
}

function showMsg(text, color="#9ca3af") {
  const el = document.getElementById("fpMsg");
  el.innerText = text;
  el.style.color = color;
}

function openForgot() {
  const el = document.getElementById("forgotCard");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

/* ===== EXISTING FUNCTIONS (NOT REMOVED, ONLY ENHANCED UI) ===== */

async function sendOTP() {
  const email = document.getElementById('fpEmail').value;

  const res = await fetch('/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });

  if (res.ok) {
    showMsg("OTP sent to your email", "#22c55e");
    document.getElementById('otpSection').style.display = 'block';
  } else {
    showMsg("User not found", "#ef4444");
  }
}

async function verifyOTP() {
  const email = document.getElementById('fpEmail').value;
  const otp = document.getElementById('fpOtp').value;

  const res = await fetch('/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, otp })
  });

  if (res.ok) {
    showMsg("OTP verified", "#22c55e");
    document.getElementById('resetSection').style.display = 'block';
  } else {
    showMsg("Invalid or expired OTP", "#ef4444");
  }
}

async function resetPassword() {
  const email = document.getElementById('fpEmail').value;
  const pass = document.getElementById('fpPass').value;
  const pass2 = document.getElementById('fpPass2').value;

  if (pass !== pass2) {
    showMsg("Passwords do not match", "#ef4444");
    return;
  }

  if (pass.length < 6) {
    showMsg("Password too weak", "#ef4444");
    return;
  }

  const res = await fetch('/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  });

  if (res.ok) {
    showMsg("Password updated. Login now.", "#22c55e");
  } else {
    showMsg("Error resetting password", "#ef4444");
  }
}
</script>

</body>
</html>
