<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<style>
body {
  margin:0;
  font-family:system-ui;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CARD */
.card {
  background: rgba(17,24,39,0.9);
  backdrop-filter: blur(12px);
  padding:32px;
  border-radius:20px;
  width:340px;
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  border:1px solid rgba(99,102,241,0.2);
}

/* TITLE */
.title {
  text-align:center;
  margin-bottom:20px;
  font-size:22px;
  font-weight:600;
}

/* INPUT */
.input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  background:#020617;
  border:1px solid #334155;
  color:white;
}

.input:focus {
  border-color:#6366f1;
  box-shadow:0 0 0 2px rgba(99,102,241,0.2);
}

/* BUTTON */
.btn {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(90deg,#6366f1,#818cf8);
  font-weight:600;
  cursor:pointer;
}

.btn:hover {
  transform:translateY(-1px);
}

/* LINK */
.link {
  margin-top:12px;
  text-align:center;
  font-size:13px;
  color:#9ca3af;
}

.link a {
  color:#818cf8;
  text-decoration:none;
}

/* MESSAGE */
.msg {
  font-size:13px;
  text-align:center;
  margin-bottom:10px;
  color:#9ca3af;
}
.msg.success { color:#22c55e; }
.msg.error { color:#ef4444; }
</style>
</head>

<body>

<div class="card">
  <div class="title">Reset Password</div>

  <!-- 🔥 STATUS -->
  <div id="msg" class="msg"></div>

  <!-- EMAIL -->
  <input class="input" id="fpEmail" placeholder="Enter email" />
  <button class="btn" onclick="sendOTP()">Send OTP</button>

  <!-- OTP -->
  <div id="otpSection" style="display:none;">
    <input class="input" id="fpOtp" placeholder="Enter OTP" />
    <button class="btn" onclick="verifyOTP()">Verify OTP</button>
  </div>

  <!-- RESET -->
  <div id="resetSection" style="display:none;">
    <input class="input" id="fpPass" type="password" placeholder="New Password" />
    <input class="input" id="fpPass2" type="password" placeholder="Confirm Password" />
    <button class="btn" onclick="resetPassword()">Reset Password</button>
  </div>

  <div class="link">
    <a href="/login">← Back to Login</a>
  </div>
</div>

<script>
// 🔥 MESSAGE HELPER (NEW, no logic break)
function showMsg(text, type="") {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + type;
}

// 🔥 EXISTING FUNCTION (KEPT, only UI improved)
function showStep(step) {
  document.getElementById('otpSection').style.display = 'none';
  document.getElementById('resetSection').style.display = 'none';

  if (step === 'otp') {
    document.getElementById('otpSection').style.display = 'block';
  }

  if (step === 'reset') {
    document.getElementById('resetSection').style.display = 'block';
  }
}

// 🔥 BUTTON LOADING (KEPT)
function setLoading(btn, text="Processing...") {
  btn.disabled = true;
  btn.innerText = text;
}

function resetBtn(btn, text) {
  btn.disabled = false;
  btn.innerText = text;
}

// 🔥 EMAIL VALIDATION (KEPT)
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// ================= SEND OTP =================
async function sendOTP() {
  const btn = event.target;
  const email = document.getElementById('fpEmail').value;

  if (!isValidEmail(email)) {
    showMsg("Invalid email format", "error");
    return;
  }

  setLoading(btn, "Sending...");

  const res = await fetch('/send-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });

  resetBtn(btn, "Send OTP");

  if (res.ok) {
    showMsg("OTP sent to your email", "success");
    showStep('otp');
  } else {
    showMsg("Email not found", "error");
  }
}

// ================= VERIFY OTP =================
async function verifyOTP() {
  const btn = event.target;

  const email = document.getElementById('fpEmail').value;
  const otp = document.getElementById('fpOtp').value;

  if (!otp) {
    showMsg("Enter OTP", "error");
    return;
  }

  setLoading(btn, "Verifying...");

  const res = await fetch('/verify-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, otp })
  });

  resetBtn(btn, "Verify OTP");

  if (res.ok) {
    showMsg("OTP verified", "success");
    showStep('reset');
  } else {
    showMsg("Invalid or expired OTP", "error");
  }
}

// ================= RESET PASSWORD =================
async function resetPassword() {
  const btn = event.target;

  const email = document.getElementById('fpEmail').value;
  const pass = document.getElementById('fpPass').value;
  const pass2 = document.getElementById('fpPass2').value;

  if (!pass || !pass2) {
    showMsg("Fill all fields", "error");
    return;
  }

  if (pass.length < 6) {
    showMsg("Password too weak", "error");
    return;
  }

  if (pass !== pass2) {
    showMsg("Passwords do not match", "error");
    return;
  }

  setLoading(btn, "Updating...");

  const res = await fetch('/reset-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pass })
  });

  resetBtn(btn, "Reset Password");

  if (res.ok) {
    showMsg("Password updated successfully", "success");
    setTimeout(() => {
      window.location.href = "/login";
    }, 1200);
  } else {
    showMsg("Error resetting password", "error");
  }
}
</script>

</body>
</html>
